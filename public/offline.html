<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAFAFA" />
    <title>Offline — Dokumenku</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 24px; background: #fafafa; color: #171717;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: 100%; max-width: 360px; background: #fff; border: 1px solid #e5e7eb;
        border-radius: 20px; padding: 32px; text-align: center;
      }
      img { width: 56px; height: 56px; border-radius: 14px; }
      h1 { font-size: 18px; margin: 20px 0 6px; }
      p { font-size: 14px; color: #6b7280; line-height: 1.5; margin: 0 0 20px; }
      button {
        border: 0; border-radius: 12px; background: #111827; color: #fff;
        font-size: 13px; font-weight: 500; padding: 10px 18px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="" />
      <h1>Anda sedang offline</h1>
      <p>Dokumenku butuh koneksi internet untuk membuka dokumen dari Google Drive.</p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
